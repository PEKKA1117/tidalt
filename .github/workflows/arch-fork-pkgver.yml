name: Bump arch-fork pkgver

# Keeps pkgver in packaging/arch-fork/PKGBUILD in step with master, so the
# checked-in file names the commit a fresh `makepkg -si` will build instead of
# whatever was last built by hand.
#
# The bump is its own commit, so the file always names the merge it was bumped
# for — one commit behind HEAD. That is inherent to a pkgver kept in git; the
# pkgver() function still computes the real value at build time.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges must not race to push competing bumps.
concurrency:
  group: arch-fork-pkgver
  cancel-in-progress: false

jobs:
  bump:
    name: bump pkgver
    runs-on: ubuntu-latest
    # A push made with GITHUB_TOKEN does not trigger workflows, so the bump
    # commit cannot loop; this guard covers a bump pushed by hand.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v5
        with:
          # pkgver() runs git describe, which needs the full history and tags.
          fetch-depth: 0
          fetch-tags: true

      - name: Compute pkgver
        id: ver
        run: |
          # Reuse the PKGBUILD's own pkgver() rather than copying its sed: it
          # cds into $srcdir/$pkgname, so point that at this checkout.
          srcdir=$(mktemp -d)
          ln -s "$GITHUB_WORKSPACE" "$srcdir/tidalt"
          # shellcheck disable=SC1091
          source packaging/arch-fork/PKGBUILD
          echo "pkgver=$(pkgver)" >> "$GITHUB_OUTPUT"

      - name: Update PKGBUILD
        id: update
        env:
          PKGVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          sed -i "s/^pkgver=.*/pkgver=${PKGVER}/" packaging/arch-fork/PKGBUILD
          if git diff --quiet; then
            echo "pkgver already ${PKGVER}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          PKGVER: ${{ steps.ver.outputs.pkgver }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(packaging): bump arch-fork pkgver to ${PKGVER} [skip ci]"
          git push origin HEAD:master
